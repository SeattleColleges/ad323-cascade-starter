[project]
name = "cascade-mobility-pipeline"
version = "0.1.0"
description = "AD 323 Data Engineering: Cascade Mobility bike share pipeline (student starter)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Exact pins: students never choose versions themselves. uv.lock pins the rest.
dependencies = [
    "confluent-kafka==2.16.1",
    "dbt-core==1.11.16",
    "dbt-duckdb==1.11.1",
    "duckdb==1.5.6",
    "prefect==3.9.0",
    "streamlit==1.66.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cascade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
# Run one week's tests with:  uv run pytest -m week03
markers = [
    "week01: Week 1, environment and sample data",
    "week02: Week 2, ingestion to bronze",
    "week03: Week 3, cleaning to silver",
    "week04: Week 4, star schema in SQL",
    "week05: Week 5, dbt and the incremental fact",
    "week06: Week 6, Prefect orchestration",
    "week07: Week 7, Spark vs. DuckDB (DuckDB side)",
    "week08: Week 8, streaming consumer",
    "week09: Week 9, secrets and PII masking",
    "week10: Week 10, DataOps checks",
    "week11: Week 11, dashboard",
]
